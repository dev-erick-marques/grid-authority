spring.application.name=device
server.port=8081
device.simulation.id=device-01
device.simulation.name=Device Alpha
device.simulation.voltage.base=220.0
device.simulation.voltage.variation=4.0
device.simulation.schedule.ms=1000

device.simulation.surgeVariation=80.0
device.simulation.surge.duration-ms=15000
device.simulation.surge.interval-ms=30000

device.network.host=localhost
coordinator.url=http://localhost:8080

command.verification.enabled=false
command.verification.timestamp-tolerance-ms=30000
hcs.enabled=false
hcs.network=testnet
hcs.public-key-topic-id=${HEDERA_PUBLIC_KEY_TOPIC_ID}
hcs.max-messages-to-scan=100

# Values: http (default) | mqtt
transport.mode=http

# --- MQTT (only used when transport.mode=mqtt) ---
mqtt.broker-url=ssl://hivemq:8883
mqtt.client-id-prefix=device-
mqtt.qos=1
mqtt.topic-prefix=gridauthority