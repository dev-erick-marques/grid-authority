spring.application.name=device
server.port=8081
device.simulation.id=device-01
device.simulation.name=Device Alpha
# Must match the coordinator policy nominal voltage (230 V)
device.simulation.voltage.base=230.0
device.simulation.voltage.wander-std=1.2
device.simulation.voltage.wander-time-constant-seconds=20
device.simulation.voltage.load-swing=1.5
device.simulation.voltage.load-period-seconds=300
device.simulation.voltage.noise-std=0.25
device.simulation.voltage.resolution=0.1
device.simulation.schedule.ms=1000

# Progressive sag/swell events (percent of nominal, seconds)
device.simulation.surge.swell-percent=12
device.simulation.surge.sag-percent=14
device.simulation.surge.ramp-seconds=40
device.simulation.surge.hold-seconds=25
device.simulation.surge.recover-seconds=30
device.simulation.surge.cycle-variation-percent=25
device.simulation.surge.interval-ms=90000

device.network.host=localhost
coordinator.url=http://localhost:8080

command.verification.timestamp-tolerance-ms=30000

transport.mode=http

mqtt.broker-url=ssl://hivemq:8883
mqtt.client-id-prefix=device-
mqtt.qos=1
mqtt.topic-prefix=gridauthority