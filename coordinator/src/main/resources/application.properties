spring.application.name=coordinator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

voltage.repository.window.size=${VOLTAGE_REPOSITORY_WINDOW_SIZE:30}
telemetry.sample-interval-ms=${TELEMETRY_SAMPLE_INTERVAL_MS:1000}
actuator.backup-available=${ACTUATOR_BACKUP_AVAILABLE:true}
actuator.priority-load-available=${ACTUATOR_PRIORITY_LOAD_AVAILABLE:true}
metrics.history.size=${METRICS_HISTORY_SIZE:100}
prediction.horizon.seconds=${PREDICTION_HORIZON_SECONDS:60}
prediction.min-confidence=${PREDICTION_MIN_CONFIDENCE:0.75}
prediction.preemptive-risk=${PREDICTION_PREEMPTIVE_RISK:0.80}
prediction.critical-risk=${PREDICTION_CRITICAL_RISK:0.95}
governance.warning-risk=${GOVERNANCE_WARNING_RISK:0.30}
governance.cooldown-seconds=${GOVERNANCE_COOLDOWN_SECONDS:30}
governance.recovery-risk=${GOVERNANCE_RECOVERY_RISK:0.35}
governance.recovery-stable-seconds=${GOVERNANCE_RECOVERY_STABLE_SECONDS:20}

authority.key-id=${AUTHORITY_KEY_ID:local-authority}
authority.private-key-base64=${AUTHORITY_PRIVATE_KEY_BASE64:}
authority.activation-window-ms=${AUTHORITY_ACTIVATION_WINDOW_MS:0}

transport.mode=${TRANSPORT_MODE:http}

mqtt.broker-url=${MQTT_BROKER_URL:ssl://hivemq:8883}
mqtt.client-id=${MQTT_CLIENT_ID:coordinator}
mqtt.qos=${MQTT_QOS:1}
mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:gridauthority}
