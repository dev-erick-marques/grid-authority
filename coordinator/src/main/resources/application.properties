spring.application.name=coordinator

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
stability.stable-cycles-required=${STABLE_CICLES_REQUIRED:15}

transport.mode=http

mqtt.broker-url=ssl://hivemq:8883
mqtt.client-id=coordinator
mqtt.qos=1
mqtt.topic-prefix=gridauthority

authority.key-id=${AUTHORITY_KEY_ID:local-authority}
authority.private-key-base64=${AUTHORITY_PRIVATE_KEY_BASE64:}
authority.activation-window-ms=${AUTHORITY_ACTIVATION_WINDOW_MS:0}
